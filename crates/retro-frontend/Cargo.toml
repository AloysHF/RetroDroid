[package]
name = "retro-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "libretro frontend runtime embedded in RetroDroid"

[lib]
name = "retro_frontend"
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.9"
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"

[build-dependencies]
cc = "1"
