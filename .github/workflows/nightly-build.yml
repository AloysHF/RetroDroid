name: Nightly Build

# Build the APKs every night and publish them as a rolling `nightly-build`
# GitHub prerelease, so users can always grab the latest from master without
# waiting for a tagged version.
#
# Triggers:
#   - Cron at 20:00 UTC (04:00 Beijing) every day.
#   - Manual workflow_dispatch.
#   - Every push to master (so the rolling release always reflects HEAD).

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)"
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null || true
          "$TOOLS/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build APKs
        env:
          RETRODROID_SKIP_MISSING: "1"
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          ./scripts/build-apk.sh assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: retrodroid-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute version metadata
        id: ver
        shell: bash
        run: |
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "DATETIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: retrodroid-apks
          path: release-assets

      - name: Recreate nightly-build release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DATE: ${{ steps.ver.outputs.DATE }}
          DATETIME: ${{ steps.ver.outputs.DATETIME }}
          SHORT_SHA: ${{ steps.ver.outputs.SHORT_SHA }}
        shell: bash
        run: |
          gh release delete nightly-build --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/nightly-build" 2>/dev/null || true

          notes=$(cat <<EOF
          Automated nightly build — **for testing only**.

          - Built: $DATETIME
          - Commit: [\`$SHORT_SHA\`](https://github.com/$REPO/commit/${{ github.sha }})
          - Universal APK plus per-ABI APKs for \`arm64-v8a\` and \`x86_64\`
          - All nine emulator cores are bundled; nothing is downloaded at runtime

          ⚠️ Signed with the debug key: uninstall a release build before installing this one.
          EOF
          )

          gh release create nightly-build \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "Nightly Build $DATE ($SHORT_SHA)" \
            --notes "$notes" \
            --prerelease \
            release-assets/*.apk
