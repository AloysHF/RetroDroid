name: android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)"
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null || true
          "$TOOLS/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build APKs
        env:
          RETRODROID_SKIP_MISSING: "1"
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          ./scripts/build-apk.sh assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: retrodroid-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
